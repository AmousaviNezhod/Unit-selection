name: Deploy React app to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'react-app/**'
      - 'data/**'
      - '.github/workflows/deploy-react.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-react
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: react-app/package-lock.json

      - name: Install dependencies
        working-directory: react-app
        run: npm ci || npm install

      - name: Build
        working-directory: react-app
        run: npm run build

      - name: Add data files (courses, prices, last-update)
        run: |
          mkdir -p react-app/dist/data
          cp data/courses.txt react-app/dist/data/
          cp data/couresPrice.html react-app/dist/data/
          cp data/last-update.txt react-app/dist/data/
          [ -f example.txt ] && cp example.txt react-app/dist/ || true

      - name: SPA fallback (404 → index)
        run: cp react-app/dist/index.html react-app/dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: react-app/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
